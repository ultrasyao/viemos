name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate android folder
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.viemos --project-name viemos /tmp/gen
            cp -r /tmp/gen/android ./android
          fi
          sed -i 's/android:label="[^"]*"/android:label="Viemos"/' android/app/src/main/AndroidManifest.xml
      - name: Pakai keystore tetap
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: viemos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
