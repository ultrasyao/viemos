name: Build APK + AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate android folder
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.viemos --project-name viemos /tmp/gen
            cp -r /tmp/gen/android ./android
          fi
          sed -i 's/android:label="[^"]*"/android:label="Viemos"/' android/app/src/main/AndroidManifest.xml
      - name: Patch Android (izin, FLAG_SECURE, desugaring, signing)
        run: python3 ci/patch_android.py
      - name: Naikkan compileSdk app
        run: sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle*
      - name: Ikon aplikasi
        run: |
          pip install pillow
          python3 ci/make_icon.py
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_IN: ${{ secrets.KEY_ALIAS }}
          KEY_PASS_IN: ${{ secrets.KEY_PASSWORD }}
        run: |
          JKS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$JKS"
            SP="$KEYSTORE_PASS"; ALIAS="${KEY_ALIAS_IN:-upload}"; KP="${KEY_PASS_IN:-$KEYSTORE_PASS}"
            echo "Pakai kunci rilis dari Secrets."
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi. Memakai kunci SEMENTARA: APK ini cuma untuk uji coba (tiap build beda tanda tangan, tidak bisa di-update dan TIDAK bisa diupload ke Play Store)."
            SP="$(openssl rand -hex 12)"; KP="$SP"; ALIAS=temp
            keytool -genkeypair -keystore "$JKS" -storepass "$SP" -keypass "$KP" \
              -alias temp -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Viemos Temp"
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$SP" "$KP" "$ALIAS" "$JKS" > android/key.properties
      - run: flutter pub get
      - name: Naikkan compileSdk plugin
        run: |
          PC="${PUB_CACHE:-$HOME/.pub-cache}"
          sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk = 36/' "$PC"/hosted/pub.dev/*/android/build.gradle*
      - name: Build AAB (untuk Play Store)
        run: flutter build appbundle --release --no-shrink --obfuscate --split-debug-info=build/symbols --build-number=$((GITHUB_RUN_NUMBER + 100))
      - name: Build APK (untuk dipasang langsung)
        run: flutter build apk --release --no-shrink --obfuscate --split-debug-info=build/symbols --build-number=$((GITHUB_RUN_NUMBER + 100))
      - name: Bersihkan kunci dari runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: viemos-apk
          path: build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: viemos-aab-playstore
          path: build/app/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: viemos-debug-symbols
          path: build/symbols
